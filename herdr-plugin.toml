id = "benjmhart.inandout"
name = "In and Out"
version = "0.4.2"
min_herdr_version = "0.9.3"
description = "vim's jump list for herdr, across every machine: prefix+o back to where you were, prefix+i forward, prefix+shift+i the list"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "back"
title = "Jump back (older)"
command = ["python3", "inandout.py", "back"]

[[actions]]
id = "forward"
title = "Jump forward (newer)"
command = ["python3", "inandout.py", "forward"]

[[actions]]
id = "pick"
title = "Jump history list"
command = ["python3", "inandout.py", "pick"]

[[panes]]
id = "ui"
title = "Jump history"
placement = "popup"
width = "90%"
height = "80%"
command = ["python3", "inandout.py", "ui"]
